<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1400" height="640" fill="#f8fafc"/>

  <!-- left: a LibreNMS custom map -->
  <text x="40" y="52" font-size="26" font-weight="800" fill="#0f172a">LibreNMS Custom Map</text>
  <text x="40" y="80" font-size="15" fill="#64748b">nodes, edges with ports, a node that links to another map</text>
  <rect x="40" y="100" width="470" height="300" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="140" y1="170" x2="300" y2="170" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <text x="230" y="142" font-size="13" fill="#16a34a" font-weight="700" text-anchor="middle">22%</text>
  <line x1="320" y1="190" x2="320" y2="300" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="330" y="250" font-size="13" fill="#dc2626" font-weight="700">97%</text>
  <line x1="150" y1="190" x2="150" y2="300" stroke="#111827" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="160" y="250" font-size="13" fill="#111827" font-weight="700">down</text>
  <rect x="70" y="150" width="140" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="174" font-size="15" text-anchor="middle" fill="#1e3a8a">core-sw-01</text>
  <rect x="250" y="150" width="140" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="174" font-size="15" text-anchor="middle" fill="#1e3a8a">fw-core-01</text>
  <rect x="80" y="304" width="140" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="328" font-size="15" text-anchor="middle" fill="#7f1d1d">fw-svg-01 ✖</text>
  <ellipse cx="320" cy="324" rx="88" ry="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="329" font-size="15" text-anchor="middle" fill="#78350f">→ Bergen DC</text>
  <text x="430" y="372" font-size="13" fill="#94a3b8" text-anchor="end">+ LLDP/CDP neighbours</text>

  <!-- right: the island -->
  <text x="890" y="52" font-size="26" font-weight="800" fill="#0f172a">Road Trip</text>
  <text x="890" y="80" font-size="15" fill="#64748b">an island you can drive on</text>
  <rect x="890" y="100" width="470" height="300" rx="14" fill="#1d6fa5"/>
  <path d="M930 160 C 930 120, 1050 115, 1120 125 C 1220 115, 1290 140, 1280 220 C 1300 300, 1200 360, 1100 350 C 1000 365, 920 330, 930 260 C 905 220, 925 190, 930 160 Z" fill="#e9d8a6"/>
  <path d="M945 165 C 945 135, 1050 130, 1120 140 C 1210 130, 1270 152, 1262 220 C 1282 292, 1195 344, 1100 336 C 1005 350, 935 318, 945 260 C 922 222, 940 192, 945 165 Z" fill="#5b9a4e"/>
  <line x1="1000" y1="190" x2="1180" y2="190" stroke="#41454d" stroke-width="26" stroke-linecap="round"/>
  <line x1="1000" y1="190" x2="1180" y2="190" stroke="#e5c34a" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="1050" y="177" width="12" height="7" rx="2" fill="#84cc16"/><rect x="1110" y="196" width="12" height="7" rx="2" fill="#a3e635"/>
  <line x1="1180" y1="190" x2="1180" y2="300" stroke="#41454d" stroke-width="30"/>
  <rect x="1162" y="225" width="7" height="12" rx="2" fill="#ef4444"/><rect x="1162" y="245" width="7" height="12" rx="2" fill="#f97316"/><rect x="1192" y="232" width="7" height="12" rx="2" fill="#ef4444"/><rect x="1192" y="262" width="7" height="12" rx="2" fill="#dc2626"/>
  <line x1="1000" y1="190" x2="1000" y2="290" stroke="#6b7280" stroke-width="24"/>
  <rect x="984" y="236" width="32" height="6" fill="#dc2626"/><rect x="984" y="242" width="32" height="6" fill="#fff"/>
  <circle cx="1000" cy="190" r="26" fill="#41454d"/><circle cx="1000" cy="190" r="9" fill="#4d7c3f"/>
  <circle cx="1180" cy="190" r="26" fill="#41454d"/><circle cx="1180" cy="190" r="9" fill="#4d7c3f"/>
  <rect x="955" y="122" width="88" height="34" rx="5" fill="#fff" stroke="#2563eb" stroke-width="4"/><text x="999" y="144" font-size="12" text-anchor="middle" font-weight="700">core-sw-01</text>
  <rect x="1136" y="122" width="88" height="34" rx="5" fill="#fff" stroke="#dc2626" stroke-width="4"/><text x="1180" y="144" font-size="12" text-anchor="middle" font-weight="700">fw-core-01</text>
  <rect x="955" y="300" width="88" height="34" rx="5" fill="#1f2937"/><text x="999" y="322" font-size="12" text-anchor="middle" font-weight="700" fill="#e5e7eb">fw-svg-01</text>
  <circle cx="1030" cy="296" r="9" fill="#9ca3af" opacity=".7"/><circle cx="1036" cy="282" r="12" fill="#9ca3af" opacity=".5"/><text x="1020" y="330" font-size="14">🔥</text>
  <polygon points="1180,300 1196,316 1330,380 1350,368 1214,300" fill="#a8a29e" stroke="#8b5e34" stroke-width="5"/>
  <text x="1350" y="335" font-size="13" font-weight="700" fill="#fff" text-anchor="end">🌉 to Bergen DC</text>
  <text x="960" y="385" font-size="12" fill="#e2e8f0">P = stop here to open the device / port page</text>

  <!-- the mapping -->
  <g font-size="16" fill="#0f172a">
    <line x1="530" y1="140" x2="870" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="700" y="130" text-anchor="middle" font-weight="700">custom map → island</text>
    <line x1="530" y1="200" x2="870" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="700" y="190" text-anchor="middle" font-weight="700">device node → building + P</text>
    <line x1="530" y1="260" x2="870" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="700" y="250" text-anchor="middle" font-weight="700">edge + port → road with traffic</text>
    <line x1="530" y1="320" x2="870" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="700" y="310" text-anchor="middle" font-weight="700">map link node → bridge</text>
    <line x1="530" y1="380" x2="870" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="700" y="370" text-anchor="middle" font-weight="700">LLDP/CDP neighbours → extra island</text>
  </g>

  <!-- legend -->
  <g font-size="15" fill="#334155">
    <text x="40" y="460" font-size="18" font-weight="800" fill="#0f172a">What you see on the way</text>
    <rect x="40" y="480" width="26" height="12" rx="3" fill="#22c55e"/><rect x="70" y="480" width="26" height="12" rx="3" fill="#facc15"/><rect x="100" y="480" width="26" height="12" rx="3" fill="#f97316"/><rect x="130" y="480" width="26" height="12" rx="3" fill="#ef4444"/><rect x="160" y="480" width="26" height="12" rx="3" fill="#a855f7"/>
    <text x="200" y="492">traffic in each direction, coloured like LibreNMS: 0 % → 100 % → overloaded; busy roads are slow</text>
    <text x="40" y="526">🛣️ wider road = faster link (1G, 10G, 25/40G, 100G)   ·   ⛔ barriers + "ROAD CLOSED" = port down</text>
    <text x="40" y="556">🟢 up   🔴🔥 down (smoke)   🚧 just rebooted (scaffolding)   ⚪ disabled (boarded up)   🔴 1 = active alerts (flashing beacon)</text>
    <text x="40" y="586">🌉 bridge heads warn ⚠ when devices are down on the other island   ·   📻 the car radio reads the LibreNMS event log</text>
    <text x="40" y="616">🧭 N = drive to the next problem   ·   O = overview   ·   🐧 brake for penguins   ·   🌊 the sea stops you (splash)</text>
  </g>
</svg>
